    band: "<=5L"
    min_amount_inr: 0
    max_amount_inr: 500000
    max_tenure_months: 48
    min_bureau_band: "650-699"
    ntc_allowed: true
    ntc_min_monthly_income_inr: 50000
    max_ltv_pct: null
    required_conditions:
      - {id: nach_mandate, text: "Auto-debit (NACH) mandate for the EMI from the salary account"}
      - {id: kyc_complete, text: "KYC (PAN and address proof) verified before disbursal"}
