# Sanction grid: what a sanction memo must respect for each product and ticket size.
# One row per product x ticket band. Read by the synthetic data generator (memo conditions, tenure limits),
# by the policy engine, and shown to Module E as structured data.
#
# Row fields
#   product, band          the product and the human label of the ticket band
#   min_amount_inr         exclusive lower bound of the band (rupees)
#   max_amount_inr         inclusive upper bound of the band (null = open ended)
#   max_tenure_months      longest tenure a memo may state
#   min_bureau_band        lowest bureau score band a memo may rely on (state vocabulary)
#   ntc_allowed            whether a new-to-credit applicant can be sanctioned in this row at all
#   ntc_min_monthly_income_inr   income floor when ntc_allowed (rupees per month)
#   max_ltv_pct            home loans only: highest loan-to-value the memo may sanction (percent)
#   required_conditions    every listed condition must appear in the memo: `id` is stable, `text` is what the
#                          memo says (no rupee figures, so the text can travel in a question)
version: "grid-v1"
description: >
  Synthetic sanction grid for the Jev loan appraisal support system. Illustrative policy, not any real bank's.
  Home-loan LTV limits follow the RBI ceilings (90/80/75 percent by ticket) tightened to the bank's own 80
  percent maximum.

bureau_band_vocabulary: ["NTC", "<600", "600-649", "650-699", "700-749", "750-799", "800+"]

rows:
